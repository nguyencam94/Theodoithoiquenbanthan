<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312e81" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#flowGrad)" filter="url(#shadow)" />

  <!-- Inner glowing ring / habit streak track -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="28" stroke-linecap="round" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-dasharray="930" stroke-dashoffset="240" />

  <!-- Flowing bold checkmark -->
  <path d="M192 262 L234 304 L326 204" fill="none" stroke="url(#checkGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sparkling success star -->
  <circle cx="346" cy="158" r="16" fill="#fbbf24" />
</svg>
